<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Prediction Board</title><style>body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;display:grid;place-items:center;min-height:100vh;margin:0}.load{max-width:620px;padding:32px;text-align:center}small{color:#8b949e}</style></head><body><div class="load"><h1>NFL Prediction Board</h1><p id="s">Loading v4.12 model and latest prediction data…</p><small>Sportsbook lines are comparison only and never feed the model.</small></div><script>async function gunzipB64(x){const b=atob(x),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw Error('Your browser does not support the required data decompression.');return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}async function boot(){try{const m=await fetch('data/manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Manifest unavailable');return r.json()});window.__NFL_ASSET_MANIFEST=m;const parts=await Promise.all(m.assets.app.parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('App asset unavailable');return r.text()})));const html=await gunzipB64(parts.join(''));document.open();document.write(html);document.close()}catch(e){document.getElementById('s').textContent='Unable to load the hosted board: '+e.message;console.error(e)}}boot()</script></body></html>
