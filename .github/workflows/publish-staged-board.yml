name: Publish staged prediction board

on:
  push:
    branches: [main]
    paths:
      - data/staging/READY
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-prediction-board
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble readable multipart staging
        run: python3 scripts/reassemble_staging.py

      - name: Validate, package and switch manifest
        run: python3 scripts/publish_staging.py

      - name: Commit validated publication
        run: |
          if git diff --quiet -- data; then
            echo "No publication changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Publish validated per-snapshot board data"
          git push
