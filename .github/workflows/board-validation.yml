name: Board validation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'data/manifest.json'
      - '.github/workflows/board-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate board JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>(.*?)</script>",html,re.S)
          Path("/tmp/board.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/board.js
      - name: Run board regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate published weekly reviews
        run: python3 scripts/validate_manifest_reviews.py
