name: Validate prediction board

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'data/manifest.json'
      - '.github/workflows/validate-board.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run weekly review regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate current manifest reviews
        run: python3 scripts/validate_manifest_reviews.py
